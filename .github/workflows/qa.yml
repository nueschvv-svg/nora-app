name: Pilot QA
on:
  pull_request:
    paths-ignore: ['docs/**', '*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: NORA_PG_BIN="$(pg_config --bindir)" npm test
      - run: npm run lint
      # Bloquea lo que de verdad se despliega. Las dependencias de
      # producción tienen que estar limpias, sin excepciones.
      - name: Auditoría de dependencias de producción (bloquea)
        run: npm audit --omit=dev --audit-level=high
      # No bloquea, pero queda a la vista en cada corrida. Hoy falla por
      # GHSA-vfj7-8cjw-p6xm en braces, que llega por ESLint y NO TIENE
      # PARCHE: braces@3.0.3 es la última publicada y micromatch@4.0.8 y
      # fast-glob@3.3.3 siguen dependiendo de ella. Lo único que ofrece npm
      # es bajar eslint-config-next de 16.3.5 a 14.2.35, un downgrade mayor
      # incompatible con Next 16. No se silencia la alerta: se deja de
      # bloquear el release por algo que no se puede arreglar y que no viaja
      # al usuario, y se sigue imprimiendo. Volver a hacerlo bloqueante en
      # cuanto haya versión parcheada.
      - name: Auditoría completa, incluido desarrollo (informativa)
        run: npm audit --audit-level=high || true
      - run: npm run build
        env:
          # Build configuration only, not a functioning backend or a secret.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_qa
